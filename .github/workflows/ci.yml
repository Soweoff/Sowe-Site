name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Não bloqueia o CI por enquanto; passe a bloquear quando o lint estiver limpo.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build (tsc + vite)
        run: npm run build
